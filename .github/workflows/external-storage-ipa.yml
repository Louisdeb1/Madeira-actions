name: Build Madeira v0.1.2 External Storage + Game Mode + ProMotion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout overlay source
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Download Madeira 0.1.2 IPA
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/Madeira.ipa \
            "https://github.com/willfaust/Madeira/releases/download/v0.1.2/Madeira-0.1.2.ipa"
          echo "ed1cd1fdb5e93a33d0f4584f74d04519ace8f39791eb4129487c8f36ff2e3815  /tmp/Madeira.ipa" | shasum -a 256 -c -
          rm -rf /tmp/madeira-work
          mkdir -p /tmp/madeira-work
          unzip -q /tmp/Madeira.ipa -d /tmp/madeira-work
          test -f /tmp/madeira-work/Payload/Madeira.app/Madeira.debug.dylib

      - name: Verify launcher symbols
        shell: bash
        run: |
          set -euxo pipefail
          APP=/tmp/madeira-work/Payload/Madeira.app
          nm -gU "$APP/Madeira.debug.dylib" > /tmp/madeira-symbols.txt
          for s in \
            _wine_process_start \
            _wine_process_is_running \
            _wineserver_start \
            _wineserver_is_running \
            _wineserver_stop
          do
            grep -q " $s$" /tmp/madeira-symbols.txt || {
              echo "Missing exported symbol: $s"
              exit 1
            }
          done

      - name: Save original entitlements
        shell: bash
        run: |
          set -euxo pipefail
          APP=/tmp/madeira-work/Payload/Madeira.app
          codesign -d --entitlements :- "$APP" > /tmp/app-entitlements.plist 2>/dev/null || true
          test -s /tmp/app-entitlements.plist
          if [ -d "$APP/PlugIns/MadeiraJITHelper.appex" ]; then
            codesign -d --entitlements :- "$APP/PlugIns/MadeiraJITHelper.appex" > /tmp/helper-entitlements.plist 2>/dev/null || true
          fi

      - name: Enable Game Mode ProMotion and EXE documents
        shell: bash
        run: |
          set -euxo pipefail
          APP=/tmp/madeira-work/Payload/Madeira.app
          PLIST="$APP/Info.plist"

          python3 - "$PLIST" <<'PY'
          import plistlib, sys
          path = sys.argv[1]
          with open(path, 'rb') as f:
              p = plistlib.load(f)

          p['LSSupportsGameMode'] = True
          p['CADisableMinimumFrameDurationOnPhone'] = True
          p['LSApplicationCategoryType'] = 'public.app-category.games'
          p['LSSupportsOpeningDocumentsInPlace'] = True

          ident = 'com.louisdeb.windows-executable'
          imported = [x for x in p.get('UTImportedTypeDeclarations', [])
                      if x.get('UTTypeIdentifier') != ident]
          imported.append({
              'UTTypeIdentifier': ident,
              'UTTypeDescription': 'Windows Executable',
              'UTTypeConformsTo': ['public.data'],
              'UTTypeTagSpecification': {
                  'public.filename-extension': ['exe'],
                  'public.mime-type': ['application/vnd.microsoft.portable-executable', 'application/x-msdownload'],
              },
          })
          p['UTImportedTypeDeclarations'] = imported

          docs = [x for x in p.get('CFBundleDocumentTypes', [])
                  if ident not in x.get('LSItemContentTypes', [])]
          docs.append({
              'CFBundleTypeName': 'Windows Executable',
              'CFBundleTypeRole': 'Viewer',
              'LSHandlerRank': 'Owner',
              'LSItemContentTypes': [ident],
          })
          p['CFBundleDocumentTypes'] = docs

          with open(path, 'wb') as f:
              plistlib.dump(p, f, fmt=plistlib.FMT_BINARY, sort_keys=False)
          PY

          /usr/libexec/PlistBuddy -c 'Print :LSSupportsGameMode' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :UTImportedTypeDeclarations' "$PLIST" | grep -q 'com.louisdeb.windows-executable'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes' "$PLIST" | grep -q 'com.louisdeb.windows-executable'

      - name: Inject direct EXE external-storage launcher
        shell: bash
        run: |
          set -euxo pipefail
          APP=/tmp/madeira-work/Payload/Madeira.app
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          SRC="$GITHUB_WORKSPACE/external-storage/ExternalStorageOverlay.m"
          BUILD_SRC=/tmp/ExternalStorageOverlay.m

          cp "$SRC" "$BUILD_SRC"
          python3 - "$BUILD_SRC" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          old = 'initForOpeningContentTypes:@[UTTypeItem] asCopy:NO'
          new = 'initForOpeningContentTypes:@[[UTType importedTypeWithIdentifier:@"com.louisdeb.windows-executable" conformingToType:UTTypeData]] asCopy:NO'
          if old not in s:
              raise SystemExit('picker pattern not found')
          s = s.replace(old, new)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -q 'com.louisdeb.windows-executable' "$BUILD_SRC"

          cp "$APP/Madeira.debug.dylib" "$APP/Morig.dylib"
          install_name_tool -id '@loader_path/Morig.dylib' "$APP/Morig.dylib"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios17.0 \
            -isysroot "$SDK" \
            -dynamiclib \
            -fobjc-arc -fblocks -fmodules \
            -framework UIKit \
            -framework Foundation \
            -framework UniformTypeIdentifiers \
            -framework QuartzCore \
            -Wl,-reexport_library,"$APP/Morig.dylib" \
            -Wl,-install_name,@rpath/Madeira.debug.dylib \
            "$BUILD_SRC" \
            -o "$APP/Madeira.debug.dylib"

          otool -L "$APP/Madeira.debug.dylib"
          nm -gU "$APP/Madeira.debug.dylib" | grep -E 'wine_process_start|wineserver_start' || true
          strings "$APP/Madeira.debug.dylib" | grep -q 'SSD + EXE'
          strings "$APP/Madeira.debug.dylib" | grep -q '__ExternalGame'
          strings "$APP/Madeira.debug.dylib" | grep -q 'MADEIRA_EXTERNAL_ROOT'
          strings "$APP/Madeira.debug.dylib" | grep -q 'com.louisdeb.windows-executable'

      - name: Ad-hoc sign modified bundle
        shell: bash
        run: |
          set -euxo pipefail
          APP=/tmp/madeira-work/Payload/Madeira.app

          rm -rf "$APP/_CodeSignature"
          codesign --force --sign - "$APP/Morig.dylib"
          codesign --force --sign - "$APP/Madeira.debug.dylib"

          if [ -d "$APP/Frameworks/StikJIT.framework" ]; then
            codesign --force --sign - "$APP/Frameworks/StikJIT.framework"
          fi

          if [ -d "$APP/PlugIns/MadeiraJITHelper.appex" ]; then
            rm -rf "$APP/PlugIns/MadeiraJITHelper.appex/_CodeSignature"
            if [ -s /tmp/helper-entitlements.plist ]; then
              codesign --force --sign - --entitlements /tmp/helper-entitlements.plist "$APP/PlugIns/MadeiraJITHelper.appex"
            else
              codesign --force --sign - "$APP/PlugIns/MadeiraJITHelper.appex"
            fi
          fi

          codesign --force --sign - --entitlements /tmp/app-entitlements.plist "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/out"
          mkdir -p "$GITHUB_WORKSPACE/out/Payload"
          ditto /tmp/madeira-work/Payload/Madeira.app "$GITHUB_WORKSPACE/out/Payload/Madeira.app"
          cd "$GITHUB_WORKSPACE/out"
          zip -qry Madeira-v0.1.2-EXE-TypeFix-GameMode-ProMotion.ipa Payload
          shasum -a 256 Madeira-v0.1.2-EXE-TypeFix-GameMode-ProMotion.ipa | tee Madeira-v0.1.2-EXE-TypeFix-GameMode-ProMotion.ipa.sha256
          ls -lh Madeira-v0.1.2-EXE-TypeFix-GameMode-ProMotion.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-v0.1.2-EXE-TypeFix-GameMode-ProMotion
          path: |
            out/Madeira-v0.1.2-EXE-TypeFix-GameMode-ProMotion.ipa
            out/Madeira-v0.1.2-EXE-TypeFix-GameMode-ProMotion.ipa.sha256
          if-no-files-found: error
